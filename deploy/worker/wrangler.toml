name = "cloudflare-imgbed"
main = "index.js"
compatibility_date = "2024-08-21"
compatibility_flags = ["global_fetch_strictly_public"]

[assets]
directory = "../../frontend-dist"
binding = "ASSETS"
not_found_handling = "single-page-application"

[images]
binding = "IMAGES"

[[kv_namespaces]]
binding = "img_url"
id = "kv_x"

[[r2_buckets]]
binding = "img_r2"
bucket_name = "imgbed-r2"
